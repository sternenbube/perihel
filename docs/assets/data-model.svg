<text x="336" y="600" font-size="14" fill="#4a5560">standalone — no relations,</text>
<text x="336" y="620" font-size="14" fill="#4a5560">holds settings such as the check day</text>
<text x="76" y="730" font-size="13" font-weight="700" letter-spacing="1" fill="#8a6d1f">RULES</text>
<text x="76" y="758" font-size="15" fill="#6b5514">•  Amounts are stored as whole numbers — no decimals. SQLite has no boolean type, so is_active holds 0 or 1.</text>
<text x="76" y="786" font-size="15" fill="#6b5514">•  A month with no entry rows means “not entered”, never 0.</text>
<text x="76" y="814" font-size="15" fill="#6b5514">•  Accounts are deactivated (is_active), never deleted while they have history.</text>
<text x="76" y="842" font-size="15" fill="#6b5514">•  The category sits on the account, so moving an account moves its whole history.</text>
